# Checks every PR and every push to main or dev: dataset validation + type check + static build.
# Deployment is done by Cloudflare Pages' own Git integration (no secrets needed here) — see docs/DEPLOY.md.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ingest/ingest.mjs --check # every outlet has a valid entry in data/feeds.json
      - run: node scripts/events/check.mjs # data/events/events.json is valid (the build checks it too)
      - run: npm test # unit tests (node:test, scripts/**/*.test.mjs)
      - run: npm run build # astro check + astro build; fails on any invalid outlet record
