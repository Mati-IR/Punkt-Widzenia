# Fetches headlines from every outlet in data/feeds.json every 2 hours. See docs/INGEST.md.
# Flow (founder decision, PUN-96): new headlines are committed on a branch data/headlines-<time> cut
# from `master` and go through their own PR into `dev`, which this workflow merges itself once it has
# checked that the commit touches only data/articles/ and data/ingest/. Then promote-data.yml opens the
# same commits as a PR into `master`, merges it automatically and deploys the site to the Cloudflare
# Worker (secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, variable SITE_URL; docs/DEPLOY.md).
# The rulesets on `master`/`dev` require the checks `build` and `review-gate`. PRs opened with the
# Actions token start no other workflows, so this workflow runs the build and the data-only check
# itself and reports both as commit statuses (see the merge step).
name: Ingest headlines

on:
  schedule:
    - cron: '7 */2 * * *' # fallback only: GitHub skips most of these. The punkt-widzenia Worker
                          # starts this workflow every 2 h via workflow_dispatch (docs/DEPLOY.md).
  push: # run once right after a change to the pipeline lands on master
    branches: [master]
    paths:
      - .github/workflows/ingest.yml
      - scripts/ingest/**
      - data/feeds.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.merge.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master # always ingest on top of production, whatever branch triggered the run
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch headlines # no npm install: the script has no dependencies
        run: node scripts/ingest/ingest.mjs
      - name: Commit headlines on a PR branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/articles data/ingest
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          branch="data/headlines-$(date -u +%Y%m%d-%H%M)"
          git checkout -q -b "$branch"
          git commit -q -m "data: headlines $stamp"
          # Only headline data may go through this automatic path (the review-gate exception).
          bad=$(git diff --name-only HEAD~1 HEAD | grep -v -E '^data/(articles|ingest)/' || true)
          if [ -n "$bad" ]; then echo "::error::Headlines PR would touch other files:"; echo "$bad"; exit 1; fi
          { echo "stamp=$stamp"; echo "branch=$branch"; echo "sha=$(git rev-parse HEAD)"; echo "new=true"; } >> "$GITHUB_OUTPUT"
      # PRs opened with the Actions token do not start other workflows, so CI does not run on this PR.
      # This job runs the same build itself and reports the two required checks as commit statuses.
      - if: steps.commit.outputs.new == 'true'
        run: npm ci
      - if: steps.commit.outputs.new == 'true'
        run: npm run build
      - name: Open and merge the headlines PR into dev
        id: merge
        if: steps.commit.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAMP: ${{ steps.commit.outputs.stamp }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git push -q origin "$BRANCH"
          url=$(gh pr create --base dev --head "$BRANCH" --title "data: headlines $STAMP" \
            --body "Automatic headlines ingest (only data/articles and data/ingest). Merged by the Ingest workflow and promoted to master by promote-data.yml, see docs/INGEST.md.")
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success -f context=build \
            -f description="Built by the Ingest workflow" -f target_url="$RUN_URL" >/dev/null
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success -f context=review-gate \
            -f description="Headlines only (data/articles, data/ingest): no review needed" -f target_url="$RUN_URL" >/dev/null
          for i in 1 2 3; do
            # A real merge (not squash), so dev and master share the commit (see promote-data.yml).
            if gh pr merge "$BRANCH" --merge --delete-branch --subject "data: headlines $STAMP [skip ci]" --body ""; then
              echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 10
          done
          echo "::error::Could not merge the headlines PR after 3 attempts"; exit 1

  promote:
    needs: ingest
    if: needs.ingest.outputs.pr != ''
    uses: ./.github/workflows/promote-data.yml
    with:
      pr: ${{ fromJSON(needs.ingest.outputs.pr) }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      statuses: write
