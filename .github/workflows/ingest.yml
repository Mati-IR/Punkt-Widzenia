# Fetches headlines from every outlet in data/feeds.json every 2 hours and commits
# them to data/articles/ + the per-source report to data/ingest/health.json. See docs/INGEST.md.
# Commits carry [skip ci], so they trigger neither CI nor a Cloudflare build. Instead, when a run
# finds new headlines, the `deploy` job rebuilds the site and deploys it to the Cloudflare Worker
# (secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, variable SITE_URL; see docs/DEPLOY.md).
# Without the secrets the deploy job is skipped and ingest works as before.
name: Ingest headlines

on:
  schedule:
    - cron: '7 */2 * * *' # every 2 h, off the hour (GitHub delays jobs queued at :00)
  push: # run once right after a change to the pipeline lands on main (e.g. merging this PR)
    branches: [main]
    paths:
      - .github/workflows/ingest.yml
      - scripts/ingest/**
      - data/feeds.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch headlines # no npm install: the script has no dependencies
        run: node scripts/ingest/ingest.mjs
      - name: Commit new headlines
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/articles data/ingest
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "data: headlines $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && echo "changed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep 5
          done
          echo "Push failed after 3 attempts"; exit 1

  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set, skipping deploy (see docs/DEPLOY.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ github.ref_name }} # the branch tip, which includes the headlines commit just pushed
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run build
      - name: Deploy to Cloudflare Worker
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
