# Merges `master` into `dev` after a push to `master` (a founder-approved release or a hotfix), so
# `dev` always contains production (PUN-91, PUN-96). Data does not need it: data goes into `dev` first
# and is promoted to `master` with the same commits (promote-data.yml).
# It goes through a PR master -> dev like everything else. `master` is production, already checked and
# approved, so the review gate lets this PR through; the job builds the merged tree itself and reports
# `build` + `review-gate` as commit statuses (PRs opened by the Actions token start no workflows).
# On a merge conflict it fails and leaves `dev` untouched: the Chief of staff resolves it with a PR.
name: Sync master into dev

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge master into dev locally
        id: merge
        run: |
          if ! git ls-remote --exit-code --heads origin dev >/dev/null; then echo "No dev branch yet."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin master dev
          if git merge-base --is-ancestor origin/master origin/dev; then echo "dev already has master."; exit 0; fi
          echo "sha=$(git rev-parse origin/master)" >> "$GITHUB_OUTPUT"
          git checkout -q -B sync-check origin/dev
          if ! git merge -q --no-edit origin/master; then
            git merge --abort
            echo "::error::master does not merge cleanly into dev. Resolve it with a PR into dev."; exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.needed == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.merge.outputs.needed == 'true'
        run: npm ci
      - if: steps.merge.outputs.needed == 'true'
        run: npm run build
      - name: Open and merge the PR master -> dev
        if: steps.merge.outputs.needed == 'true'
        env:
          SHA: ${{ steps.merge.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr=$(gh pr list --base dev --head master --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base dev --head master --title "sync: master into dev" \
              --body "Automatic sync of production into dev (sync-dev.yml). No review needed: master is already approved."
          fi
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success -f context=build \
            -f description="Merged tree built by Sync master into dev" -f target_url="$RUN_URL" >/dev/null
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success -f context=review-gate \
            -f description="Sync of production (master) into dev: no review needed" -f target_url="$RUN_URL" >/dev/null
          for i in 1 2 3; do
            gh pr merge master --merge --subject "sync: master into dev [skip ci]" --body "" && exit 0
            sleep 10
          done
          echo "::error::Could not merge master into dev after 3 attempts"; exit 1
